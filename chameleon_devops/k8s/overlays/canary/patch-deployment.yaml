# k8s/overlays/canary/patch-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-service
spec:
  replicas: 2                         # fewer replicas in canary
  template:
    spec:
      containers:
        - name: feature-service
          image: ghcr.io/YOUR_USERNAME/feature-service:__TAG__
